name: Python tests

on:
  push:
    paths:
      - "python-expense-tracker/**"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "python-expense-tracker/**"
      - ".github/workflows/python-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s python-expense-tracker -p "test_*.py" -v
